[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-singularity-hpc"
version = "0.1.0"
description = "Writable-rootfs Singularity environment for harbor on FUSE-restricted HPC clusters (SWE-bench on PBS/SLURM, no Docker/Modal)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lintang Sutawika" }]
keywords = ["harbor", "singularity", "apptainer", "swe-bench", "hpc", "slurm", "pbs"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

# harbor is a peer dependency: it must already be installed in the same
# environment (its own install is out of scope here, and it may be vendored
# from git rather than PyPI). The range below is the *tested* one -- widen it
# only after re-running tests/ against the new harbor, since the overrides
# reach into harbor's Singularity backend.
dependencies = [
    "harbor>=0.22,<0.23",
    "httpx",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/lintangsutawika/harbor-singularity-hpc"

# Register the environment under harbor's plugin entry-point group as well, so
# installations can discover it without spelling the full import path. Harbor
# environments are also always selectable via --environment-import-path.
[project.entry-points."harbor.environments"]
singularity_writable = "harbor_singularity_hpc.environment:SingularityWritableEnvironment"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_singularity_hpc"]
